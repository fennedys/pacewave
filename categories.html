<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — PaceWave Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="container navbar-inner">
      <nav id="site-nav" class="nav-inner"></nav>
    </div>
  </header>

  <section class="page-banner">
    <div class="container">
      <h1>🗂️ Categories</h1>
      <p>Pick a genre and start browsing.</p>
    </div>
  </section>

  <section class="container">
    <div class="cat-grid" id="cat-grid"></div>
  </section>

  <footer class="footer" id="site-footer"></footer>

  <script src="app.js"></script>
  <script>
    (function () {
      const PW = window.PW;
      PW.renderNav('categories');
      PW.renderFooter();

      const grid = document.getElementById('cat-grid');
      grid.innerHTML = '<div class="empty-state">Loading categories…</div>';
      const icons = ['📚','📖','🔬','💼','💻','🌱','🐉','👤','🎭','🧠'];

      PW.api('/api/categories?with_books=true')
        .then((d) => {
          grid.innerHTML = '';
          d.categories.forEach((c, i) => {
            const card = PW.el('a', 'cat-card');
            card.href = 'library.html?category=' + encodeURIComponent(c.id);
            card.innerHTML =
              '<span class="cat-icon">' + (icons[i % icons.length]) + '</span>' +
              '<h3>' + PW.escapeHtml(c.name) + '</h3>' +
              '<p>' + (c.book_count || 0) + ' books</p>';
            grid.appendChild(card);
          });
          if (!d.categories.length) {
            grid.innerHTML = '<div class="empty-state">No categories yet.</div>';
          }
        })
        .catch((e) => { grid.innerHTML = '<div class="empty-state">' + PW.escapeHtml(e.message) + '</div>'; });
    })();
  </script>
</body>
</html>
